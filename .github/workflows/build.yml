# Every push: PC gate tests + firmware build. Publishing a GitHub release (tag vX.Y.Z, matching
# FW_VERSION) also publishes the flashing page and the update files to GitHub Pages
# (Settings -> Pages -> Source: GitHub Actions) and attaches the .bin files to the release.
name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PC gate tests
        run: sh test/run.sh
      - uses: arduino/setup-arduino-cli@v2
      - name: ESP32 core 2.0.9 and PubSubClient 2.8
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.9
          arduino-cli lib install "PubSubClient@2.8"
      - name: Build
        run: ARDUINO_CLI=arduino-cli sh tools/build.sh
      - name: Pack release files (release notes = the release's title)
        env:
          NOTES: ${{ github.event.release.name }}
        run: python3 tools/release.py "$NOTES"
      - name: Check the version matches the release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          V="v$(python3 -c "import json;print(json.load(open('docs/version.json'))['version'])")"
          test "$V" = "$TAG" || { echo "FW_VERSION is $V but the release tag is $TAG"; exit 1; }
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'release'
        with: { path: docs }
      - name: Attach the firmware files to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            docs/firmware/*.bin
  deploy:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
