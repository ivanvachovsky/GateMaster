# Every push: PC gate tests + firmware build. A tag vX.Y.Z also publishes the flashing page and the
# release files to GitHub Pages (Settings -> Pages -> Source: GitHub Actions).
name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PC gate tests
        run: sh test/run.sh
      - uses: arduino/setup-arduino-cli@v2
      - name: ESP32 core 2.0.9 and PubSubClient 2.8
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.9
          arduino-cli lib install "PubSubClient@2.8"
      - name: Build
        run: ARDUINO_CLI=arduino-cli sh tools/build.sh
      - name: Pack release files
        run: python3 tools/release.py "$(git tag -l --format='%(contents:subject)' ${GITHUB_REF_NAME} 2>/dev/null || true)"
      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(python3 -c "import json;print(json.load(open('docs/version.json'))['version'])")" = "${GITHUB_REF_NAME}"
      - uses: actions/upload-pages-artifact@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with: { path: docs }
      - name: GitHub release with the firmware files
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            docs/firmware/*.bin
  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
